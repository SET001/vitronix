[workspace]
members = ["plugins/*"]
resolver = "2"

[package]
edition = "2024"
name = "vitronix"
version = "0.1.0"

[dependencies]
dioxus.workspace = true
dioxus-dnd-kit.workspace = true
dioxus-sdk-storage.workspace = true
dirs.workspace = true
indexmap.workspace = true
libloading = "0.8"
serde.workspace = true
toml.workspace = true
# enables the `ansi` feature of tracing-subscriber so dioxus-logger output is colored
tracing-subscriber = { version = "0.3", features = ["ansi", "fmt"] }
uuid.workspace = true

[dev-dependencies]
rand = "0.9"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[workspace.dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-dnd-kit = "0.4.0"
dioxus-sdk-storage = { version = "0.7" }
dirs = "5.0"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.28.0", features = ["v4"] }

[patch.crates-io]
dioxus-floating = { path = "../dioxus-floating" }
